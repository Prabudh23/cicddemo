name: cicddemo CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build project and run unit tests
        run: mvn -B clean package

      - name: Deploy WAR file to local Tomcat
        shell: powershell
        run: |
          $war = Get-ChildItem -Path target -Filter "*.war" -File | Select-Object -First 1

          if ($null -eq $war) {
            throw "WAR file was not created. Check pom.xml has <packaging>war</packaging>."
          }

          curl.exe --fail --show-error --silent `
            -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" `
            --upload-file $war.FullName `
            "${{ secrets.TOMCAT_URL }}/manager/text/deploy?path=/cicddemo&update=true"
